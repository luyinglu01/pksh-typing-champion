<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老師管理頁面</title>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB25e8VFzjneOwJ_0-xmlM3UA8-QF15KzM",
  authDomain: "typing-champion-pksh.firebaseapp.com",
  databaseURL: "https://typing-champion-pksh-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "typing-champion-pksh",
  storageBucket: "typing-champion-pksh.firebasestorage.app",
  messagingSenderId: "488113242984",
  appId: "1:488113242984:web:a9a78c6ee35f0cacc78cdd"
};
</script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --bg2: #f5f5f3; --bg3: #ebebea;
  --text: #1a1a1a; --text2: #666;
  --border: rgba(0,0,0,0.12);
  --purple: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #534AB7;
  --green: #1D9E75; --green-light: #EAF3DE;
  --red: #E24B4A; --red-light: #FCEBEB;
  --radius: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1a1a1a; --bg2:#242424; --bg3:#2e2e2e; --text:#f0f0f0; --text2:#999; --border:rgba(255,255,255,0.12); --purple-light:#26215C; --green-light:#173404; --red-light:#501313; }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
h2 { font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 12px; }
input[type=text], input[type=password] { width: 100%; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 15px; background: var(--bg); color: var(--text); outline: none; }
input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-light); }
button { padding: 9px 18px; border: 0.5px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: background .15s; }
button:hover { background: var(--bg2); }
.btn-p { background: var(--purple); color: #fff; border-color: var(--purple); }
.btn-p:hover { background: var(--purple-dark); }
.btn-r { background: var(--red); color: #fff; border-color: var(--red); }
.btn-r:hover { background: #A32D2D; }
.btn-g { background: var(--green); color: #fff; border-color: var(--green); }
.screen { display: none; }
.screen.active { display: block; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { justify-content: space-between; }
.row-end { justify-content: flex-end; }
.mt1 { margin-top: 1rem; }
.mb1 { margin-bottom: 1rem; }
.gap8 { gap: 8px; }
.divider { border: none; border-top: 0.5px solid var(--border); margin: 1rem 0; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: var(--purple-light); color: var(--purple-dark); }
.class-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.class-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.class-name { font-weight: 500; font-size: 15px; }
.class-score { font-size: 13px; color: var(--text2); }
.prog-bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.prog-fill { height: 100%; border-radius: 4px; background: var(--purple); transition: width .5s ease; }
.prog-fill.done { background: var(--green); }
.student-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.student-table th { text-align: left; padding: 6px 8px; color: var(--text2); border-bottom: 0.5px solid var(--border); font-weight: 500; }
.student-table td { padding: 7px 8px; border-bottom: 0.5px solid var(--border); }
.student-table tr:last-child td { border-bottom: none; }
.rank-medal { font-size: 15px; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--text2); }
.tab.active { background: var(--purple-light); border-color: var(--purple); color: var(--purple-dark); font-weight: 500; }
.alert { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; }
.alert-green { background: var(--green-light); color: var(--green); }
.alert-red { background: var(--red-light); color: var(--red); }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

<!-- 登入畫面 -->
<div id="s-login" class="screen active">
  <h1>老師管理頁面</h1>
  <p style="font-size:14px;color:var(--text2);margin-bottom:1.5rem">請輸入管理員密碼</p>
  <div class="card">
    <div style="position:relative;width:100%">
      <input type="password" id="inp-pwd" placeholder="輸入密碼" onkeydown="if(event.key==='Enter') login()" style="width:100%;padding-right:52px">
      <button onclick="var i=document.getElementById('inp-pwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'顯示':'隱藏'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:#666;font-size:13px;cursor:pointer;line-height:1">顯示</button>
    </div>
    <div class="row row-end mt1">
      <button class="btn-p" onclick="login()">登入</button>
    </div>
  </div>
  <div id="login-err" style="display:none" class="alert alert-red">密碼錯誤，請再試一次</div>
</div>

<!-- 管理主頁 -->
<div id="s-admin" class="screen">
  <div class="row row-between mb1">
    <h1>班級積分管理</h1>
    <button class="btn-r" onclick="confirmReset()">🔄 重置本週分數</button>
  </div>

  <!-- 班級總覽 -->
  <div id="class-overview"></div>

  <hr class="divider">

  <!-- 學生排行 -->
  <h2>學生個人貢獻</h2>
  <div class="tab-bar" id="class-tabs"></div>
  <div id="student-list"></div>

  <hr class="divider">

  <!-- 帳號管理 -->
  <h2>帳號管理</h2>
  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">搜尋學生帳號</div>
    <div class="row gap8">
      <input type="text" id="inp-search" placeholder="輸入學號或姓名搜尋">
      <button class="btn-p" onclick="searchStudent()">搜尋</button>
    </div>
    <div id="search-result" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">所有帳號（共 <span id="total-accounts">0</span> 人）</div>
    <div id="all-accounts"></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<!-- 確認重置對話框 -->
<div id="confirm-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:center;justify-content:center">
  <div style="background:var(--bg);border-radius:var(--radius-lg);padding:1.5rem;max-width:340px;width:90%;margin:auto">
    <h2 style="margin-bottom:8px">確認重置？</h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:1.5rem">此操作會清除所有學生的本週積分，無法復原。</p>
    <div class="row row-end gap8">
      <button onclick="cancelReset()">取消</button>
      <button class="btn-r" onclick="doReset()">確認重置</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const ADMIN_PWD = 'pksh0815';
const CLASSES = ['商一甲','商一乙','應一甲','貿一甲'];
const TARGETS = { '商一甲': 150, '商一乙': 150, '應一甲': 80, '貿一甲': 80 };
const MEDALS = ['🥇','🥈','🥉'];

function toast(msg, isRed) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isRed ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function login() {
  const pwd = document.getElementById('inp-pwd').value;
  if (pwd === ADMIN_PWD) {
    document.getElementById('s-login').classList.remove('active');
    document.getElementById('s-admin').classList.add('active');
    document.getElementById('login-err').style.display = 'none';
    loadData();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

var allStudents = [];
var currentTab = '商一甲';

function loadData() {
  db.ref('users').on('value', function(snap) {
    const data = snap.val() || {};
    allStudents = Object.values(data);
    renderOverview();
    renderTabs();
    renderStudentList(currentTab);
    renderAllAccounts();
  });
}

function renderOverview() {
  const overview = document.getElementById('class-overview');
  overview.innerHTML = CLASSES.map(cls => {
    const students = allStudents.filter(s => s.class === cls);
    const total = students.reduce((sum, s) => sum + (s.weekScore || 0), 0);
    const target = TARGETS[cls];
    const pct = Math.min(100, Math.round((total / target) * 100));
    const done = total >= target;
    return `<div class="class-card">
      <div class="class-header">
        <span class="class-name">${cls} ${done ? '✅' : ''}</span>
        <span class="class-score">${total} / ${target} 題 &nbsp;${pct}%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill ${done?'done':''}" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--text2)">${students.length} 位學生${done ? ' ・ 已達標！' : ` ・ 還差 ${target-total} 題`}</div>
    </div>`;
  }).join('');
}

function renderTabs() {
  document.getElementById('class-tabs').innerHTML = CLASSES.map(cls =>
    `<button class="tab ${cls===currentTab?'active':''}" onclick="switchTab('${cls}')">${cls}</button>`
  ).join('');
}

function switchTab(cls) {
  currentTab = cls;
  renderTabs();
  renderStudentList(cls);
}

function renderStudentList(cls) {
  const students = allStudents
    .filter(s => s.class === cls)
    .sort((a, b) => (b.weekScore||0) - (a.weekScore||0));
  const total = students.reduce((sum, s) => sum + (s.weekScore||0), 0);

  if (students.length === 0) {
    document.getElementById('student-list').innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text2);font-size:14px">此班目前沒有學生</div>`;
    return;
  }

  document.getElementById('student-list').innerHTML = `
    <table class="student-table">
      <thead><tr>
        <th style="width:40px">排名</th>
        <th>姓名</th>
        <th>學號</th>
        <th style="text-align:right">完成題次</th>
        <th style="text-align:right">貢獻比</th>
        <th style="text-align:center">操作</th>
      </tr></thead>
      <tbody>${students.map((s, i) => {
        const score = s.weekScore || 0;
        const pct = total > 0 ? Math.round((score / total) * 100) : 0;
        return `<tr>
          <td><span class="rank-medal">${MEDALS[i] || (i+1)}</span></td>
          <td>${s.name}</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;font-weight:500;color:var(--purple)">${score}</td>
          <td style="text-align:right;color:var(--text2)">${pct}%</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改積分</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

function renderAllAccounts() {
  const sorted = [...allStudents].sort((a,b) => a.class.localeCompare(b.class) || a.studentId.localeCompare(b.studentId));
  document.getElementById('total-accounts').textContent = sorted.length;
  document.getElementById('all-accounts').innerHTML = sorted.length === 0
    ? '<div style="text-align:center;padding:1rem;color:var(--text2);font-size:14px">目前沒有帳號</div>'
    : `<table class="student-table">
        <thead><tr><th>班級</th><th>姓名</th><th>學號</th><th style="text-align:right">本週積分</th><th style="text-align:center">操作</th></tr></thead>
        <tbody>${sorted.map(s => `<tr>
          <td><span class="badge">${s.class}</span></td>
          <td>${s.name}</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;color:var(--purple);font-weight:500">${s.weekScore||0}</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
}

function searchStudent() {
  const q = document.getElementById('inp-search').value.trim().toLowerCase();
  if (!q) { document.getElementById('search-result').innerHTML = ''; return; }
  const found = allStudents.filter(s =>
    s.studentId.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)
  );
  document.getElementById('search-result').innerHTML = found.length === 0
    ? '<div style="font-size:13px;color:var(--text2)">找不到符合的學生</div>'
    : `<table class="student-table">
        <thead><tr><th>班級</th><th>姓名</th><th>學號</th><th style="text-align:right">本週積分</th><th style="text-align:center">操作</th></tr></thead>
        <tbody>${found.map(s => `<tr>
          <td><span class="badge">${s.class}</span></td>
          <td>${s.name}</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;color:var(--purple);font-weight:500">${s.weekScore||0}</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
}

// ── 修改積分 ──
function editScore(studentId, name, currentScore) {
  var newScore = prompt('修改 ' + name + ' 的本週積分（目前：' + currentScore + ' 題）
請輸入新的積分：', currentScore);
  if (newScore === null) return; // 取消
  var score = parseInt(newScore);
  if (isNaN(score) || score < 0) { alert('請輸入有效的數字（0 以上）'); return; }
  db.ref('users/' + studentId + '/weekScore').set(score, function(err) {
    if (err) { toast('修改失敗：' + err.message, true); }
    else { toast('✅ 已將 ' + name + ' 的積分修改為 ' + score + ' 題'); }
  });
}

async function deleteAccount(studentId) {
  if (!confirm(`確定要刪除學號 ${studentId} 的帳號嗎？`)) return;
  await db.ref('users/' + studentId).remove();
  toast('帳號已刪除');
}

function confirmReset() {
  document.getElementById('confirm-overlay').style.display = 'flex';
}

function cancelReset() {
  document.getElementById('confirm-overlay').style.display = 'none';
}

async function doReset() {
  cancelReset();
  const snap = await db.ref('users').once('value');
  const data = snap.val() || {};
  const updates = {};
  Object.keys(data).forEach(id => {
    updates[`users/${id}/weekScore`] = 0;
    updates[`users/${id}/dailyPassages`] = null; // 同時清除每日打題紀錄
  });
  await db.ref().update(updates);
  // 記錄重置時間
  await db.ref('system/lastReset').set(new Date().toISOString());
  toast('✅ 本週分數已重置完成');
}
</script>
</body>
</html>
