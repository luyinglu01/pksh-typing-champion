<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老師管理頁面</title>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB25e8VFzjneOwJ_0-xmlM3UA8-QF15KzM",
  authDomain: "typing-champion-pksh.firebaseapp.com",

  projectId: "typing-champion-pksh",
  storageBucket: "typing-champion-pksh.firebasestorage.app",
  messagingSenderId: "488113242984",
  appId: "1:488113242984:web:a9a78c6ee35f0cacc78cdd",

</script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --bg2: #f5f5f3; --bg3: #ebebea;
  --text: #1a1a1a; --text2: #666;
  --border: rgba(0,0,0,0.12);
  --purple: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #534AB7;
  --green: #1D9E75; --green-light: #EAF3DE;
  --red: #E24B4A; --red-light: #FCEBEB;
  --radius: 8px; --radius-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1a1a1a; --bg2:#242424; --bg3:#2e2e2e; --text:#f0f0f0; --text2:#999; --border:rgba(255,255,255,0.12); --purple-light:#26215C; --green-light:#173404; --red-light:#501313; }
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
h2 { font-size: 16px; font-weight: 500; margin-bottom: 12px; }
.card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-bottom: 12px; }
input[type=text], input[type=password] { width: 100%; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius); font-size: 15px; background: var(--bg); color: var(--text); outline: none; }
input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--purple-light); }
button { padding: 9px 18px; border: 0.5px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 14px; cursor: pointer; transition: background .15s; }
button:hover { background: var(--bg2); }
.btn-p { background: var(--purple); color: #fff; border-color: var(--purple); }
.btn-p:hover { background: var(--purple-dark); }
.btn-r { background: var(--red); color: #fff; border-color: var(--red); }
.btn-r:hover { background: #A32D2D; }
.btn-g { background: var(--green); color: #fff; border-color: var(--green); }
.screen { display: none; }
.screen.active { display: block; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { justify-content: space-between; }
.row-end { justify-content: flex-end; }
.mt1 { margin-top: 1rem; }
.mb1 { margin-bottom: 1rem; }
.gap8 { gap: 8px; }
.divider { border: none; border-top: 0.5px solid var(--border); margin: 1rem 0; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: var(--purple-light); color: var(--purple-dark); }
.class-card { background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.class-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.class-name { font-weight: 500; font-size: 15px; }
.class-score { font-size: 13px; color: var(--text2); }
.prog-bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.prog-fill { height: 100%; border-radius: 4px; background: var(--purple); transition: width .5s ease; }
.prog-fill.done { background: var(--green); }
.student-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.student-table th { text-align: left; padding: 6px 8px; color: var(--text2); border-bottom: 0.5px solid var(--border); font-weight: 500; }
.student-table td { padding: 7px 8px; border-bottom: 0.5px solid var(--border); }
.student-table tr:last-child td { border-bottom: none; }
.rank-medal { font-size: 15px; }
.tab-bar { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--text2); }
.tab.active { background: var(--purple-light); border-color: var(--purple); color: var(--purple-dark); font-weight: 500; }
.alert { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; }
.alert-green { background: var(--green-light); color: var(--green); }
.alert-red { background: var(--red-light); color: var(--red); }
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 10px 20px; border-radius: var(--radius); font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

<!-- 登入畫面 -->
<div id="s-login" class="screen active">
  <h1>老師管理頁面</h1>
  <p style="font-size:14px;color:var(--text2);margin-bottom:1.5rem">請輸入管理員密碼</p>
  <div class="card">
    <div style="position:relative;width:100%">
      <input type="password" id="inp-pwd" placeholder="輸入密碼" onkeydown="if(event.key==='Enter') login()" style="width:100%;padding-right:52px">
      <button onclick="var i=document.getElementById('inp-pwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'顯示':'隱藏'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:#666;font-size:13px;cursor:pointer;line-height:1">顯示</button>
    </div>
    <div class="row row-end mt1">
      <button class="btn-p" onclick="login()">登入</button>
    </div>
  </div>
  <div id="login-err" style="display:none" class="alert alert-red">密碼錯誤，請再試一次</div>
</div>

<!-- 管理主頁 -->
<div id="s-admin" class="screen">
  <div class="row row-between mb1">
    <h1>班級積分管理</h1>
  </div>

  <!-- 班級總覽 -->
  <div id="class-overview"></div>

  <hr class="divider">

  <!-- 學生排行 -->
  <h2>學生個人貢獻</h2>
  <div class="tab-bar" id="class-tabs"></div>
  <div id="student-list"></div>

  <hr class="divider">

  <!-- 修改 Admin 密碼 -->
  <h2>修改管理員密碼</h2>
  <div class="card" style="margin-bottom:12px">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">變更管理員登入密碼</div>
    <div class="row gap8" style="flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:150px">
        <input type="password" id="inp-new-admin-pwd" placeholder="輸入新密碼" style="padding-right:52px">
        <button onclick="var i=document.getElementById('inp-new-admin-pwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'顯示':'隱藏'" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer">顯示</button>
      </div>
      <button class="btn-p" onclick="changeAdminPwd()">更新密碼</button>
    </div>
  </div>

  <hr class="divider">

  <!-- 帳號管理 -->
  <h2>帳號管理</h2>
  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">搜尋學生帳號</div>
    <div class="row gap8">
      <input type="text" id="inp-search" placeholder="輸入學號或姓名搜尋">
      <button class="btn-p" onclick="searchStudent()">搜尋</button>
    </div>
    <div id="search-result" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:var(--text2);margin-bottom:10px">所有帳號（共 <span id="total-accounts">0</span> 人）</div>
    <div id="all-accounts"></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<!-- 確認重置對話框 -->
<div id="confirm-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:100;display:none;align-items:center;justify-content:center">
  <div style="background:var(--bg);border-radius:var(--radius-lg);padding:1.5rem;max-width:340px;width:90%;margin:auto">
    <h2 id="confirm-title" style="margin-bottom:8px">確認重置？</h2>
    <p style="font-size:14px;color:var(--text2);margin-bottom:1.5rem">此操作會清除該班學生的本週積分及打題紀錄，無法復原。</p>
    <div class="row row-end gap8">
      <button onclick="cancelReset()">取消</button>
      <button class="btn-r" onclick="doReset()">確認重置</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

// admin 密碼存在 Firebase system/adminHash，不存在程式碼裡
const CLASSES = ['商一甲','商一乙','應一甲','貿一甲'];
const LEVELS = [
  { label: '⭐ 達標',      targets: { '商一甲': 58,  '商一乙': 52,  '應一甲': 28,  '貿一甲': 20  } },
  { label: '⭐⭐ 良好',    targets: { '商一甲': 81,  '商一乙': 79,  '應一甲': 39,  '貿一甲': 35  } },
  { label: '⭐⭐⭐ 優秀',  targets: { '商一甲': 115, '商一乙': 115, '應一甲': 55,  '貿一甲': 50  } },
  { label: '🎉 傳說',      targets: { '商一甲': 115, '商一乙': 115, '應一甲': 55,  '貿一甲': 50  } },
];
const TARGETS = { '商一甲': 115, '商一乙': 115, '應一甲': 55, '貿一甲': 50 }; // 最高等級目標
const MEDALS = ['🥇','🥈','🥉'];

async function sha256(str) {
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, isRed) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isRed ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function login() {
  const pwd = document.getElementById('inp-pwd').value;
  if (!pwd) { document.getElementById('login-err').style.display = 'block'; return; }

  // 從 Firebase 讀取 admin 密碼 hash 比對，不存在程式碼裡
  const snap = await db.ref('system/adminHash').once('value');
  const storedHash = snap.val();

  if (!storedHash) {
    // 第一次使用：把目前輸入的密碼設為 admin 密碼
    const hashed = await sha256(pwd);
    await db.ref('system/adminHash').set(hashed);
    document.getElementById('s-login').classList.remove('active');
    document.getElementById('s-admin').classList.add('active');
    document.getElementById('login-err').style.display = 'none';
    loadData();
    return;
  }

  const inputHash = await sha256(pwd);
  if (inputHash === storedHash) {
    document.getElementById('s-login').classList.remove('active');
    document.getElementById('s-admin').classList.add('active');
    document.getElementById('login-err').style.display = 'none';
    loadData();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

var allStudents = [];
var currentTab = '商一甲';

function loadData() {
  db.ref('users').on('value', function(snap) {
    const data = snap.val() || {};
    allStudents = Object.values(data);
    renderOverview();
    renderTabs();
    renderStudentList(currentTab);
    renderAllAccounts();
  });
}

function renderOverview() {
  const overview = document.getElementById('class-overview');
  overview.innerHTML = CLASSES.map(cls => {
    const students = allStudents.filter(s => s.class === cls);
    const total = students.reduce((sum, s) => sum + (s.weekScore || 0), 0);

    // 找當前等級
    var currentLevelIdx = -1;
    for (var li = 0; li < LEVELS.length; li++) {
      if (total >= LEVELS[li].targets[cls]) currentLevelIdx = li;
      else break;
    }
    var showLevelIdx = Math.min(currentLevelIdx + 1, LEVELS.length - 1);
    var target = LEVELS[showLevelIdx].targets[cls];
    var pct = Math.min(100, Math.round((total / target) * 100));
    var done = total >= target;
    var allDone = currentLevelIdx === LEVELS.length - 1;

    var badges = '';
    for (var ai = 0; ai <= currentLevelIdx; ai++) {
      badges += '<span style="font-size:11px;background:var(--green-light);color:var(--green);padding:1px 6px;border-radius:4px;margin-right:3px">' + LEVELS[ai].label + '</span>';
    }

    return `<div class="class-card">
      <div class="class-header">
        <span class="class-name">${cls}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="class-score">${total} / ${target} 題 &nbsp;${pct}%</span>
          <button onclick="confirmResetClass('${cls}')" style="font-size:11px;padding:3px 8px;color:var(--red);border-color:var(--red);background:none">🔄 重置</button>
        </div>
      </div>
      ${badges ? '<div style="margin-bottom:6px">' + badges + '</div>' : ''}
      <div class="prog-bar"><div class="prog-fill ${done?'done':''}" style="width:${pct}%"></div></div>
      <div style="font-size:12px;color:var(--text2)">
        ${students.length} 位學生 ・
        ${allDone ? '🎉 全部達成！' : (done ? '✅ ' + LEVELS[showLevelIdx].label + ' 達成！' : '目標：' + LEVELS[showLevelIdx].label + ' 還差 ' + (target-total) + ' 題')}
      </div>
    </div>`;
  }).join('');
}

function renderTabs() {
  document.getElementById('class-tabs').innerHTML = CLASSES.map(cls =>
    `<button class="tab ${cls===currentTab?'active':''}" onclick="switchTab('${cls}')">${cls}</button>`
  ).join('');
}

function switchTab(cls) {
  currentTab = cls;
  renderTabs();
  renderStudentList(cls);
}

function renderStudentList(cls) {
  const students = allStudents
    .filter(s => s.class === cls)
    .sort((a, b) => (b.weekScore||0) - (a.weekScore||0));
  const total = students.reduce((sum, s) => sum + (s.weekScore||0), 0);

  if (students.length === 0) {
    document.getElementById('student-list').innerHTML = `<div style="text-align:center;padding:2rem;color:var(--text2);font-size:14px">此班目前沒有學生</div>`;
    return;
  }

  document.getElementById('student-list').innerHTML = `
    <table class="student-table">
      <thead><tr>
        <th style="width:40px">排名</th>
        <th>姓名</th>
        <th>學號</th>
        <th style="text-align:right">完成題次</th>
        <th style="text-align:right">貢獻比</th>
        <th style="text-align:center">操作</th>
      </tr></thead>
      <tbody>${students.map((s, i) => {
        const score = s.weekScore || 0;
        const pct = total > 0 ? Math.round((score / total) * 100) : 0;
        return `<tr>
          <td><span class="rank-medal">${MEDALS[i] || (i+1)}</span></td>
          <td style="cursor:pointer;color:var(--purple)" onclick="toggleDetail('${s.studentId}','${s.name}')">${s.name} ▾</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;font-weight:500;color:var(--purple)">${score}</td>
          <td style="text-align:right;color:var(--text2)">${pct}%</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改積分</button>
            <button onclick="giveTicket('${s.studentId}','${s.name}')" style="font-size:12px;padding:4px 8px;color:#D48A30;border-color:#D48A30">🎫 補發道具</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
          </tr>
          <tr id="detail-${s.studentId}" style="display:none">
            <td colspan="7" style="padding:0">
              <div id="detail-content-${s.studentId}" style="padding:10px 14px;background:var(--bg3);font-size:12px"></div>
            </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
}

function renderAllAccounts() {
  const sorted = [...allStudents].sort((a,b) => a.class.localeCompare(b.class) || a.studentId.localeCompare(b.studentId));
  document.getElementById('total-accounts').textContent = sorted.length;
  document.getElementById('all-accounts').innerHTML = sorted.length === 0
    ? '<div style="text-align:center;padding:1rem;color:var(--text2);font-size:14px">目前沒有帳號</div>'
    : `<table class="student-table">
        <thead><tr><th>班級</th><th>姓名</th><th>學號</th><th style="text-align:right">本週積分</th><th style="text-align:center">操作</th></tr></thead>
        <tbody>${sorted.map(s => `<tr>
          <td><span class="badge">${s.class}</span></td>
          <td>${s.name}</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;color:var(--purple);font-weight:500">${s.weekScore||0}</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="resetPassword('${s.studentId}','${s.name}')" style="font-size:12px;padding:4px 8px">重設密碼</button>
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改積分</button>
            <button onclick="giveTicket('${s.studentId}','${s.name}')" style="font-size:12px;padding:4px 8px;color:#D48A30;border-color:#D48A30">🎫 補發道具</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
}

function searchStudent() {
  const q = document.getElementById('inp-search').value.trim().toLowerCase();
  if (!q) { document.getElementById('search-result').innerHTML = ''; return; }
  const found = allStudents.filter(s =>
    s.studentId.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)
  );
  document.getElementById('search-result').innerHTML = found.length === 0
    ? '<div style="font-size:13px;color:var(--text2)">找不到符合的學生</div>'
    : `<table class="student-table">
        <thead><tr><th>班級</th><th>姓名</th><th>學號</th><th style="text-align:right">本週積分</th><th style="text-align:center">操作</th></tr></thead>
        <tbody>${found.map(s => `<tr>
          <td><span class="badge">${s.class}</span></td>
          <td>${s.name}</td>
          <td style="color:var(--text2)">${s.studentId}</td>
          <td style="text-align:right;color:var(--purple);font-weight:500">${s.weekScore||0}</td>
          <td style="text-align:center;display:flex;gap:4px;justify-content:center">
            <button onclick="resetPassword('${s.studentId}','${s.name}')" style="font-size:12px;padding:4px 8px">重設密碼</button>
            <button onclick="editScore('${s.studentId}','${s.name}',${s.weekScore||0})" style="font-size:12px;padding:4px 8px;color:var(--purple);border-color:var(--purple)">修改積分</button>
            <button onclick="giveTicket('${s.studentId}','${s.name}')" style="font-size:12px;padding:4px 8px;color:#D48A30;border-color:#D48A30">🎫 補發道具</button>
            <button onclick="deleteAccount('${s.studentId}')" style="font-size:12px;padding:4px 8px;color:var(--red);border-color:var(--red)">刪除</button>
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
}

// ── 個人打題紀錄 ──
var openDetail = null;
function toggleDetail(studentId, name) {
  var row = document.getElementById('detail-' + studentId);
  if (!row) return;
  if (openDetail === studentId) {
    row.style.display = 'none';
    openDetail = null;
    return;
  }
  if (openDetail) {
    var prev = document.getElementById('detail-' + openDetail);
    if (prev) prev.style.display = 'none';
  }
  openDetail = studentId;
  row.style.display = '';
  var box = document.getElementById('detail-content-' + studentId);
  box.innerHTML = '<span style="color:var(--text2)">載入中...</span>';

  // 同時讀取 history（詳細成績）和 dailyPassages（每日統計）
  db.ref('users/' + studentId).once('value', function(snap) {
    var userData = snap.val();
    if (!userData) { box.innerHTML = '<span style="color:var(--text2)">尚無資料</span>'; return; }

    var history = userData.history ? Object.values(userData.history) : [];
    var dailyData = userData.dailyPassages || {};

    // 按時間排序（最新在前）
    history.sort(function(a,b) { return (b.timestamp||0)-(a.timestamp||0); });

    // ── 折線圖（每日打題數）──
    var dayMap = {};
    history.forEach(function(h) {
      var day = h.time ? h.time.split(' ')[0] : '未知';
      dayMap[day] = (dayMap[day] || 0) + 1;
    });
    var days = Object.keys(dayMap).sort();
    var chartData = days.map(function(d) { return { day: d, count: dayMap[d] }; });

    var svgChart = '';
    if (chartData.length > 0) {
      var maxCount = Math.max.apply(null, chartData.map(function(d) { return d.count; }));
      var chartW = 460, chartH = 90, padL = 28, padB = 22, padR = 10, padT = 10;
      var innerW = chartW - padL - padR;
      var innerH = chartH - padT - padB;
      var pts = chartData.map(function(d, i) {
        var x = padL + (chartData.length === 1 ? innerW/2 : i / (chartData.length-1) * innerW);
        var y = padT + innerH - (maxCount > 0 ? d.count / maxCount * innerH : 0);
        return { x: x, y: y, day: d.day, count: d.count };
      });
      var polyline = pts.map(function(p) { return p.x+','+p.y; }).join(' ');
      var area = polyline + ' ' + pts[pts.length-1].x+','+(padT+innerH) + ' ' + pts[0].x+','+(padT+innerH);
      var yLines = [];
      for (var yi = 0; yi <= maxCount; yi += Math.max(1, Math.ceil(maxCount/4))) {
        var yy = padT + innerH - (maxCount > 0 ? yi/maxCount*innerH : 0);
        yLines.push('<text x="'+(padL-4)+'" y="'+(yy+4)+'" font-size="9" text-anchor="end" fill="var(--text2)">'+yi+'</text>');
        yLines.push('<line x1="'+padL+'" y1="'+yy+'" x2="'+(chartW-padR)+'" y2="'+yy+'" stroke="var(--border)" stroke-width="0.5"/>');
      }
      var xStep = Math.ceil(pts.length/7);
      var xLabels = pts.filter(function(_,i){ return i%xStep===0||i===pts.length-1; }).map(function(p) {
        return '<text x="'+p.x+'" y="'+(chartH-5)+'" font-size="9" text-anchor="middle" fill="var(--text2)">'+p.day.slice(5)+'</text>';
      });
      var dots = pts.map(function(p) {
        return '<circle cx="'+p.x+'" cy="'+p.y+'" r="3" fill="var(--purple)" stroke="var(--bg)" stroke-width="1.5"><title>'+p.day+'：'+p.count+'次</title></circle>';
      });
      svgChart = '<div style="margin-bottom:14px">' +
        '<div style="font-size:12px;font-weight:500;margin-bottom:6px">📈 每日打題趨勢</div>' +
        '<svg width="100%" viewBox="0 0 '+chartW+' '+chartH+'" style="overflow:visible">' +
        yLines.join('') +
        '<polyline points="'+area+'" fill="var(--purple-light)" stroke="none" opacity="0.4"/>' +
        '<polyline points="'+polyline+'" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linejoin="round"/>' +
        dots.join('') + xLabels.join('') + '</svg></div>';
    }

    // ── 曾打過哪些篇（統計）──
    var passageCount = {};
    history.forEach(function(h) {
      var t = h.passage || '未知';
      if (!passageCount[t]) passageCount[t] = { count: 0, wpmSum: 0, accSum: 0 };
      passageCount[t].count++;
      passageCount[t].wpmSum += (h.wpm || 0);
      passageCount[t].accSum += (h.acc || 0);
    });
    var passageList = Object.entries(passageCount).sort(function(a,b){ return b[1].count-a[1].count; });
    var passageTags = passageList.map(function(p) {
      var avgWpm = Math.round(p[1].wpmSum/p[1].count);
      var avgAcc = Math.round(p[1].accSum/p[1].count);
      return '<div style="background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius);padding:6px 10px;font-size:12px">' +
        '<div style="font-weight:500;margin-bottom:2px">'+p[0]+'…</div>' +
        '<div style="color:var(--text2);font-size:11px">打了 <strong style="color:var(--purple)">'+p[1].count+'</strong> 次　平均 <strong>'+avgWpm+'</strong> 字/分　準確率 <strong>'+avgAcc+'%</strong></div>' +
        '</div>';
    }).join('');
    var totalSummary = '<div style="margin-bottom:14px">' +
      '<div style="font-size:12px;font-weight:500;margin-bottom:8px">📚 打過的題目（共 '+passageList.length+' 篇）</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">'+passageTags+'</div></div>';

    // ── 每次詳細紀錄 ──
    var historyRows = history.slice(0, 50).map(function(h) {
      return '<tr>' +
        '<td style="padding:5px 8px;color:var(--text2);font-size:11px">'+( h.time || '—')+'</td>' +
        '<td style="padding:5px 8px;font-size:12px">'+(h.passage||'—')+'…</td>' +
        '<td style="padding:5px 8px;text-align:right;color:var(--purple);font-weight:500">'+(h.wpm||0)+'</td>' +
        '<td style="padding:5px 8px;text-align:right">'+(h.acc||0)+'%</td>' +
        '</tr>';
    }).join('');
    var historyTable = '<div>' +
      '<div style="font-size:12px;font-weight:500;margin-bottom:8px">📋 每次成績（最近50筆）</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
      '<thead><tr style="border-bottom:0.5px solid var(--border)">' +
      '<th style="padding:5px 8px;text-align:left;color:var(--text2);font-weight:500">時間</th>' +
      '<th style="padding:5px 8px;text-align:left;color:var(--text2);font-weight:500">題目</th>' +
      '<th style="padding:5px 8px;text-align:right;color:var(--text2);font-weight:500">字/分</th>' +
      '<th style="padding:5px 8px;text-align:right;color:var(--text2);font-weight:500">準確率</th>' +
      '</tr></thead><tbody>' + (history.length > 0 ? historyRows : '<tr><td colspan="4" style="padding:12px;text-align:center;color:var(--text2)">尚無紀錄</td></tr>') +
      '</tbody></table></div>';

    box.innerHTML = (chartData.length > 0 ? svgChart : '') + totalSummary + historyTable;
  });
}

// ── 修改 Admin 密碼 ──
async function changeAdminPwd() {
  var newPwd = document.getElementById('inp-new-admin-pwd').value;
  if (!newPwd || newPwd.length < 4) { toast('密碼至少需要 4 個字元', true); return; }
  var hashed = await sha256(newPwd);
  await db.ref('system/adminHash').set(hashed);
  document.getElementById('inp-new-admin-pwd').value = '';
  toast('✅ 管理員密碼已更新');
}

// ── 補發道具券 ──
async function giveTicket(studentId, name) {
  var type = prompt(
    '補發道具券給 ' + name + '

請輸入要補發的券種：
1 = 加速券 ⚡
2 = 雙倍券 💎
3 = 縮短券 ✂️'
  );
  if (!type) return;
  var ticketMap = { '1': 'boostTicket', '2': 'doubleTicket', '3': 'shortTicket' };
  var labelMap  = { '1': '加速券 ⚡', '2': '雙倍券 💎', '3': '縮短券 ✂️' };
  if (!ticketMap[type]) { alert('請輸入 1、2 或 3'); return; }

  var ref = db.ref('users/' + studentId + '/' + ticketMap[type]);
  var snap = await ref.once('value');
  var data = snap.val() || {};
  var current = data.count || 0;
  var newCount = Math.min(current + 1, 3);
  await ref.update({ count: newCount });
  toast('✅ 已補發 ' + labelMap[type] + ' 給 ' + name + '（現有 ' + newCount + ' 張）');
}

// ── 重設密碼 ──
async function resetPassword(studentId, name) {
  var newPwd = prompt('重設 ' + name + ' 的密碼\n請輸入新密碼（至少4字元）：');
  if (newPwd === null) return;
  if (newPwd.length < 4) { alert('密碼至少需要 4 個字元'); return; }
  var hashed = await sha256(newPwd);
  await db.ref('users/' + studentId + '/password').set(hashed);
  toast('✅ ' + name + ' 的密碼已重設，請告知同學新密碼：' + newPwd);
}

// ── 修改積分 ──
function editScore(studentId, name, currentScore) {
  var newScore = prompt('修改 ' + name + ' 的本週積分（目前：' + currentScore + ' 題）\n請輸入新的積分：', currentScore);
  if (newScore === null) return; // 取消
  var score = parseInt(newScore);
  if (isNaN(score) || score < 0) { alert('請輸入有效的數字（0 以上）'); return; }
  db.ref('users/' + studentId + '/weekScore').set(score, function(err) {
    if (err) { toast('修改失敗：' + err.message, true); }
    else { toast('✅ 已將 ' + name + ' 的積分修改為 ' + score + ' 題'); }
  });
}

async function deleteAccount(studentId) {
  if (!confirm(`確定要刪除學號 ${studentId} 的帳號嗎？`)) return;
  await db.ref('users/' + studentId).remove();
  toast('帳號已刪除');
}

var resetTargetClass = null;

function confirmResetClass(cls) {
  resetTargetClass = cls;
  document.getElementById('confirm-title').textContent = '確認重置 ' + cls + '？';
  document.getElementById('confirm-overlay').style.display = 'flex';
}

function cancelReset() {
  resetTargetClass = null;
  document.getElementById('confirm-overlay').style.display = 'none';
}

async function doReset() {
  // 先把班級存起來，再關閉對話框，避免 cancelReset 清掉 resetTargetClass
  var targetCls = resetTargetClass;
  document.getElementById('confirm-overlay').style.display = 'none';
  resetTargetClass = null;

  if (!targetCls) { toast('錯誤：未指定班級', true); return; }

  const snap = await db.ref('users').once('value');
  const data = snap.val() || {};
  const updates = {};
  Object.keys(data).forEach(id => {
    var s = data[id];
    if (s.class === targetCls) {
      updates['users/' + id + '/weekScore'] = 0;
      updates['users/' + id + '/dailyPassages'] = null; // 清除每日打題記錄，讓同學可以重新計分
      // history 保留，長期成績紀錄不清除
    }
  });
  await db.ref().update(updates);
  await db.ref('system/lastReset_' + targetCls).set(new Date().toISOString());
  toast('✅ ' + targetCls + ' 分數已重置完成');
}
</script>
