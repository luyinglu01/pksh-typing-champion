function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }
function genRoomCode() { return Math.random().toString(36).slice(2,6).toUpperCase(); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showToast(msg, duration=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

// ── 狀態 ──
let myUid = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
let myName = '';
let roomId = null;
let isHost = false;
let roomRef = null;
let roomListener = null;
let gameState = null; // mirror of Firebase room
let curQ = 0;
let startTime = null;
let timerInterval = null;
let inputEnabled = false;
let myTyped = '';
let myFinishedThisQ = false;

// ── 主選單：加入配對佇列 ──
async function joinQueue() {
  myName = document.getElementById('input-name').value.trim();
  if (!myName) { showToast('請先輸入你的名字'); return; }
  const qcount = parseInt(document.getElementById('sel-qcount').value);
  const minPlayers = parseInt(document.getElementById('sel-minplayers').value);

  // 先查有沒有等待中的房間
  const snapshot = await db.ref('rooms').orderByChild('status').equalTo('waiting').once('value');
  let foundRoom = null;
  snapshot.forEach(child => {
    const r = child.val();
    const playerCount = r.players ? Object.keys(r.players).length : 0;
    if (playerCount < 4 && !foundRoom) foundRoom = { id: child.key, data: r };
  });

  if (foundRoom) {
    await joinRoom(foundRoom.id);
  } else {
    await createRoom(qcount, minPlayers);
  }
}

// ── 建立房間 ──
async function createRoom(qcount, minPlayers) {
  isHost = true;
  const code = genRoomCode();
  roomId = 'room_' + code;
  const questions = shuffle(ALL_PASSAGES).slice(0, qcount).map((t,i)=>({id:i,text:t}));
  const roomData = {
    code,
    status: 'waiting',
    hostUid: myUid,
    qcount,
    minPlayers,
    questions,
    currentQ: 0,
    players: {
      [myUid]: { name: myName, uid: myUid, joinedAt: Date.now(), progress: 0, wpm: 0, totalWpm: 0, totalAcc: 0, rounds: 0, finishedQ: -1 }
    }
  };
  await db.ref('rooms/' + roomId).set(roomData);
  db.ref('rooms/' + roomId).onDisconnect().remove();
  listenRoom();
  showScreen('screen-lobby');
}

// ── 加入房間 ──
async function joinRoom(rid) {
  roomId = rid;
  isHost = false;
  await db.ref('rooms/' + roomId + '/players/' + myUid).set({
    name: myName, uid: myUid, joinedAt: Date.now(), progress: 0, wpm: 0, totalWpm: 0, totalAcc: 0, rounds: 0, finishedQ: -1
  });
  db.ref('rooms/' + roomId + '/players/' + myUid).onDisconnect().remove();
  listenRoom();
  showScreen('screen-lobby');
}

// ── 監聽房間狀態 ──
function listenRoom() {
  if (roomListener) db.ref('rooms/' + roomId).off('value', roomListener);
  roomRef = db.ref('rooms/' + roomId);
  roomListener = roomRef.on('value', snap => {
    const data = snap.val();
    if (!data) { backToMenu(); return; }
    gameState = data;
    handleRoomUpdate(data);
  });
}

function handleRoomUpdate(data) {
  const players = data.players ? Object.values(data.players) : [];
  const playerCount = players.length;

  if (data.status === 'waiting') {
    renderLobby(data, players);
  } else if (data.status === 'countdown') {
    showScreen('screen-countdown');
    startCountdown(data.countdownStart || Date.now());
  } else if (data.status === 'playing') {
    if (document.getElementById('screen-game').classList.contains('active')) {
      updateGameProgress(data, players);
    } else {
      beginQuestion(data);
    }
  } else if (data.status === 'results') {
    showResults(data, players);
  }
}

// ── 等候室渲染 ──
function renderLobby(data, players) {
  document.getElementById('lobby-code').textContent = data.code || '----';
  document.getElementById('lobby-count').textContent = players.length + ' / 4';
  const colors = ['#7F77DD','#1D9E75','#D85A30','#D4537E'];
  document.getElementById('lobby-players').innerHTML = players.map((p,i) => `
    <div class="player-item">
      <div class="player-avatar" style="background:${colors[i]}22;color:${colors[i]}">${p.name.slice(0,2)}</div>
      <div class="player-name">${p.name}</div>
      <span class="badge ${p.uid===data.hostUid?'badge-host':'badge-waiting'}">${p.uid===data.hostUid?'房主':'等待中'}</span>
    </div>`).join('');

  const canStart = players.length >= (data.minPlayers || 2);
  document.getElementById('lobby-hint').style.display = canStart ? 'none' : 'block';
  if (isHost) {
    document.getElementById('start-btn-row').style.display = canStart ? 'flex' : 'none';
    document.getElementById('leave-btn-row').style.display = canStart ? 'none' : 'flex';
    document.getElementById('btn-start').disabled = !canStart;
  }
}

// ── 房主開始遊戲 ──
async function hostStartGame() {
  await db.ref('rooms/' + roomId).update({ status: 'countdown', countdownStart: Date.now() });
}

// ── 倒數 ──
function startCountdown(serverStart) {
  showScreen('screen-countdown');
  const elapsed = (Date.now() - serverStart) / 1000;
  let n = Math.max(1, Math.ceil(3 - elapsed));
  document.getElementById('countdown-num').textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(iv);
      if (isHost) {
        db.ref('rooms/' + roomId).update({ status: 'playing', currentQ: 0, roundStart: Date.now() });
      }
    } else {
      document.getElementById('countdown-num').textContent = n;
    }
  }, 1000);
}

// ── 開始作答 ──
function beginQuestion(data) {
  curQ = data.currentQ || 0;
  const q = data.questions[curQ];
  myTyped = '';
  myFinishedThisQ = false;
  advancingQ = false;
  startTime = data.roundStart ? new Date(data.roundStart).getTime() : Date.now();
  const players = data.players ? Object.values(data.players) : [];

  document.getElementById('g-qinfo').textContent = `第 ${curQ+1} / ${data.qcount} 題`;
  document.getElementById('g-passage-title').textContent = `題目 ${curQ+1}：`;
  document.getElementById('g-finish-banner').style.display = 'none';
  document.getElementById('g-waiting').style.display = 'none';
  renderPassage('', q.text);
  buildProgressBars(players);

  const inp = document.getElementById('g-input');
  inp.value = '';
  inp.disabled = false;
  inputEnabled = true;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => updateLiveStats(q.text), 400);
  showScreen('screen-game');
  setTimeout(() => inp.focus(), 100);
}

// ── 打字輸入 ──
document.getElementById('g-input').addEventListener('input', function() {
  if (!inputEnabled || !gameState) return;
  myTyped = this.value;
  const text = gameState.questions[curQ].text;
  renderPassage(myTyped, text);

  const correct = [...myTyped].filter((c,i) => c === text[i]).length;
  const wrong = myTyped.length - correct;
  const pct = Math.round((myTyped.length / text.length) * 100);
  const wpm = calcWpm(myTyped.length, startTime);
  const acc = myTyped.length > 0 ? Math.round((correct / myTyped.length) * 100) : 100;

  document.getElementById('g-stat-wpm').textContent = wpm;
  document.getElementById('g-stat-acc').textContent = acc + '%';
  document.getElementById('g-stat-chars').textContent = myTyped.length;
  document.getElementById('g-wpm').textContent = wpm + ' 字/分';

  // 更新自己進度到 Firebase（節流：只在整數 % 時更新）
  if (pct % 2 === 0 || myTyped === text) {
    db.ref(`rooms/${roomId}/players/${myUid}`).update({ progress: pct, wpm });
  }

  if (myTyped === text && !myFinishedThisQ) {
    myFinishedThisQ = true;
    humanFinishedQ(wpm, acc);
  }
});

function renderPassage(typed, target) {
  document.getElementById('g-passage').innerHTML = [...target].map((c,i) => {
    let cls = 'char-pending';
    if (i < typed.length) cls = typed[i] === c ? 'char-correct' : 'char-wrong';
    if (i === typed.length) cls = 'char-cursor';
    return `<span class="${cls}">${c === ' ' ? '&nbsp;' : c}</span>`;
  }).join('');
}

function buildProgressBars(players) {
  const colors = ['p-fill-1','p-fill-2','p-fill-3','p-fill-4'];
  document.getElementById('g-progress').innerHTML = players.map((p,i) => `
    <div class="p-row">
      <div class="p-label"><span>${p.name}</span><span id="ppct-${p.uid}">0%</span></div>
      <div class="p-bar"><div class="p-fill ${colors[i%4]}" id="pfill-${p.uid}" style="width:0%"></div></div>
    </div>`).join('');
}

let advancingQ = false;

function updateGameProgress(data, players) {
  players.forEach(p => {
    const fill = document.getElementById('pfill-' + p.uid);
    const lbl = document.getElementById('ppct-' + p.uid);
    if (fill) fill.style.width = Math.min(p.progress||0, 100) + '%';
    if (lbl) lbl.textContent = Math.min(Math.round(p.progress||0), 100) + '%';
  });

  // 判斷本題是否全員完成（finishedQ 明確等於 curQ 才算完成）
  const allDone = players.length > 0 && players.every(p => typeof p.finishedQ === 'number' && p.finishedQ >= curQ);
  if (allDone && isHost && data.status === 'playing' && !advancingQ) {
    advancingQ = true;
    const nextQ = curQ + 1;
    setTimeout(() => {
      if (nextQ >= data.qcount) {
        db.ref('rooms/' + roomId).update({ status: 'results' });
      } else {
        const updates = {};
        players.forEach(p => { updates[`players/${p.uid}/progress`] = 0; });
        updates.currentQ = nextQ;
        updates.roundStart = Date.now();
        updates.status = 'countdown';
        updates.countdownStart = Date.now();
        db.ref('rooms/' + roomId).update(updates);
      }
      advancingQ = false;
    }, 1500);
  }
}

function humanFinishedQ(wpm, acc) {
  clearInterval(timerInterval);
  inputEnabled = false;
  document.getElementById('g-input').disabled = true;
  const secs = Math.round((Date.now() - startTime) / 1000);

  db.ref(`rooms/${roomId}/players/${myUid}`).update({
    progress: 100,
    wpm,
    finishedQ: curQ,
    totalWpm: (gameState.players[myUid].totalWpm || 0) + wpm,
    totalAcc: (gameState.players[myUid].totalAcc || 0) + acc,
    rounds: (gameState.players[myUid].rounds || 0) + 1
  });

  const players = gameState.players ? Object.values(gameState.players) : [];
  const rank = players.filter(p => (p.finishedQ||0) >= curQ).length + 1;
  const medals = ['🥇','🥈','🥉','🏅'];
  document.getElementById('g-finish-banner').innerHTML = `${medals[rank-1]||'✅'} 完成！${wpm} 字/分 ｜ 準確率 ${acc}%`;
  document.getElementById('g-finish-banner').style.display = 'block';
  document.getElementById('g-waiting').style.display = 'block';
}

function updateLiveStats(text) {
  if (!startTime) return;
  const secs = Math.round((Date.now() - startTime) / 1000);
  document.getElementById('g-timer').textContent = '⏱ ' + secs + 's';
  const wpm = calcWpm(myTyped.length, startTime);
  document.getElementById('g-wpm').textContent = wpm + ' 字/分';
}

function calcWpm(chars, t) {
  const mins = (Date.now() - t) / 60000;
  return mins > 0 ? Math.round(chars / mins / 2) : 0;
}

// ── 顯示結果 ──
function showResults(data, players) {
  clearInterval(timerInterval);
  showScreen('screen-results');
  const ranked = players.map(p => ({
    name: p.name,
    avgWpm: p.rounds > 0 ? Math.round(p.totalWpm / p.rounds) : 0,
    avgAcc: p.rounds > 0 ? Math.round(p.totalAcc / p.rounds) : 0
  })).sort((a,b) => b.avgWpm - a.avgWpm);
  const medals = ['🥇','🥈','🥉','🏅'];
  document.getElementById('results-list').innerHTML = ranked.map((p,i) => `
    <div class="result-row ${i===0?'gold':''}">
      <div class="rank-medal">${medals[i]||i+1}</div>
      <div class="rank-name">${p.name}</div>
      <div class="rank-stats">平均 <strong>${p.avgWpm}</strong> 字/分 &nbsp; 準確率 <strong>${p.avgAcc}%</strong></div>
    </div>`).join('');
  document.getElementById('results-summary').textContent = `共完成 ${data.qcount} 題`;
}

// ── 離開房間 ──
async function leaveRoom() {
  if (roomId) await db.ref(`rooms/${roomId}/players/${myUid}`).remove();
  if (roomRef) roomRef.off('value', roomListener);
  roomId = null; isHost = false; gameState = null;
  backToMenu();
}

function backToMenu() {
  clearInterval(timerInterval);
  if (roomRef) roomRef.off('value', roomListener);
  roomId = null; isHost = false; gameState = null;
  showScreen('screen-menu');
}

async function playAgain() {
  if (!isHost) { showToast('只有房主可以重新開始'); return; }
  const qcount = gameState.qcount;
  const questions = shuffle(ALL_PASSAGES).slice(0, qcount).map((t,i)=>({id:i,text:t}));
  const updates = { status:'waiting', questions, currentQ:0 };
  // 重置玩家分數
  const players = gameState.players ? Object.values(gameState.players) : [];
  players.forEach(p => {
    updates[`players/${p.uid}/totalWpm`] = 0;
    updates[`players/${p.uid}/totalAcc`] = 0;
    updates[`players/${p.uid}/rounds`] = 0;
    updates[`players/${p.uid}/finishedQ`] = -1;
    updates[`players/${p.uid}/progress`] = 0;
  });
  await db.ref('rooms/' + roomId).update(updates);
}
</script>
